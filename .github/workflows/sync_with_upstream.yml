name: Sync fork with upstream

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  merge-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: aeteq
          repositories: open-swe

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: false

      - name: Configure git identity
        run: |
          git config user.name "Nikolas Pitsillos"
          git config user.email "npitsillos@users.noreply.github.com"

      - name: Restore rerere cache
        uses: actions/cache@v4
        with:
          path: .git/rr-cache
          key: rerere-cache-${{ github.run_id }}
          restore-keys: rerere-cache-

      - name: Enable rerere
        run: git config rerere.enabled true

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/langchain-ai/open-swe.git
          git fetch upstream

      - name: Find the merge base
        id: base
        run: echo "sha=$(git merge-base main upstream/main)" >> "$GITHUB_OUTPUT"

      - name: Create merge branch
        run: git checkout -B sync-upstream main

      - name: Merge upstream into fork
        id: merge
        run: |
          if git merge upstream/main --no-edit; then
            echo "clean=true" >> "$GITHUB_OUTPUT"
          else
            # rerere may have auto-resolved some/all conflicts using
            # previously recorded resolutions
            REMAINING=$(git diff --name-only --diff-filter=U)
            if [ -z "$REMAINING" ]; then
              git add -A
              git commit --no-edit
              echo "clean=true" >> "$GITHUB_OUTPUT"
            else
              echo "clean=false" >> "$GITHUB_OUTPUT"
              EOF_DELIM=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
              echo "conflicts<<$EOF_DELIM" >> "$GITHUB_OUTPUT"
              echo "$REMAINING" >> "$GITHUB_OUTPUT"
              echo "$EOF_DELIM" >> "$GITHUB_OUTPUT"
              git merge --abort
              git checkout -B sync-upstream upstream/main
            fi
          fi

      - name: Write the PR body
        id: report
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BASE: ${{ steps.base.outputs.sha }}
          CLEAN: ${{ steps.merge.outputs.clean }}
          CONFLICTS: ${{ steps.merge.outputs.conflicts }}
        run: |
          # The report and fork-protected-files are the fork's; a conflicted sync branch is upstream's tree.
          git checkout -q main
          PR=$(gh pr list --repo aeteq/open-swe --head sync-upstream --base main --json number --jq '.[0].number')
          REPORTED=""
          if [ -n "$PR" ]; then
            REPORTED=$(gh pr view "$PR" --repo aeteq/open-swe --json body --jq .body)
          fi
          BODY="$RUNNER_TEMP/sync-body.md"
          python3 scripts/sync_upstream_report.py --base "$BASE" --head upstream/main \
            --conflicts "$CONFLICTS" --reported "$REPORTED" > "$BODY"
          TITLE="chore: sync with upstream"
          if [ "$CLEAN" = "false" ]; then
            TITLE="$TITLE (manual conflict resolution needed)"
          fi
          {
            echo "pr=$PR"
            echo "body=$BODY"
            echo "title=$TITLE"
          } >> "$GITHUB_OUTPUT"

      # Before the push, so the checklist check the push starts reads the new body, not stale ticks.
      - name: Update the open PR
        if: steps.report.outputs.pr != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ steps.report.outputs.pr }}
          BODY: ${{ steps.report.outputs.body }}
          TITLE: ${{ steps.report.outputs.title }}
        run: gh pr edit "$PR" --repo aeteq/open-swe --title "$TITLE" --body-file "$BODY"

      - name: Push sync branch
        run: |
          git remote set-url origin https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/aeteq/open-swe.git
          git push -u origin sync-upstream --force

      - name: Open the PR
        if: steps.report.outputs.pr == ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BODY: ${{ steps.report.outputs.body }}
          TITLE: ${{ steps.report.outputs.title }}
        run: gh pr create --repo aeteq/open-swe --head sync-upstream --base main --title "$TITLE" --body-file "$BODY"
