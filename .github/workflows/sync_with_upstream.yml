name: Sync fork with upstream

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  create-update-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: aeteq
          repositories: open-swe
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: false
      - name: Configure git identity
        run: |
          git config user.name "Nikolas Pitsillos"
          git config user.email "npitsillos@users.noreply.github.com"
      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/langchain-ai/open-swe.git
          git fetch upstream
      - name: Start from clean upstream
        run: |
          git checkout -B sync-upstream upstream/main
      - name: Replay fork commits on top of upstream
        id: rebase
        run: |
          # Get all fork-only commits (commits in main that aren't in upstream)
          FORK_COMMITS=$(git rev-list --reverse upstream/main..origin/main)
          if [ -z "$FORK_COMMITS" ]; then
            echo "No fork-specific commits to replay."
            echo "has_commits=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "has_commits=true" >> $GITHUB_OUTPUT
          FAILED_FILES=""
          for COMMIT in $FORK_COMMITS; do
            SUBJECT=$(git log -1 --format='%s' "$COMMIT")
            echo "Cherry-picking: $SUBJECT ($COMMIT)"
            if ! git cherry-pick "$COMMIT" --no-edit; then
              # Collect conflicting files, then resolve by keeping our version
              CONFLICTS=$(git diff --name-only --diff-filter=U | sort)
              if [ -n "$CONFLICTS" ]; then
                FAILED_FILES=$(printf '%s\n%s' "$FAILED_FILES" "$CONFLICTS")
              fi
              git checkout --theirs .
              git add -A
              git -c core.editor=true cherry-pick --continue
            fi
          done
          # Deduplicate and store conflicting files
          FAILED_FILES=$(echo "$FAILED_FILES" | sort -u | sed '/^$/d')
          if [ -n "$FAILED_FILES" ]; then
            echo "has_conflicts=true" >> $GITHUB_OUTPUT
            EOF_DELIM=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
            echo "files<<$EOF_DELIM" >> $GITHUB_OUTPUT
            echo "$FAILED_FILES" >> $GITHUB_OUTPUT
            echo "$EOF_DELIM" >> $GITHUB_OUTPUT
          else
            echo "has_conflicts=false" >> $GITHUB_OUTPUT
          fi
      - name: Push sync branch
        if: steps.rebase.outputs.has_commits != 'false'
        run: |
          git remote set-url origin https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/aeteq/open-swe.git
          git push -u origin sync-upstream --force
      - name: Create or update PR
        if: steps.rebase.outputs.has_commits != 'false'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if git diff --quiet upstream/main...sync-upstream && git diff --quiet sync-upstream...origin/main; then
            echo "No changes between upstream+fork commits and current main."
            exit 0
          fi
          EXISTING_PR=$(gh pr list --repo aeteq/open-swe --head sync-upstream --base main --json number --jq '.[0].number')
          if [ -n "$EXISTING_PR" ]; then
            echo "PR #$EXISTING_PR already exists, force-pushed update."
            exit 0
          fi
          if [ "${{ steps.rebase.outputs.has_conflicts }}" = "true" ]; then
            CONFLICT_FILES="${{ steps.rebase.outputs.files }}"
            FILE_LIST=$(echo "$CONFLICT_FILES" | sed 's/^/- `/' | sed 's/$/`/')
            BODY=$(cat <<PREOF
          Automated sync: upstream changes applied first, then fork commits replayed on top.

          Some fork commits conflicted — resolved by keeping our fork's version.

          **Files with conflicts (our version kept):**
          ${FILE_LIST}

          Review these files to check if upstream made important changes.
          PREOF
          )
            gh pr create --repo aeteq/open-swe --head sync-upstream --base main \
              --title "chore: sync with upstream (conflicts auto-resolved)" \
              --body "$BODY"
          else
            gh pr create --repo aeteq/open-swe --head sync-upstream --base main \
              --title "chore: sync with upstream" \
              --body "Automated sync: upstream changes applied, fork commits replayed cleanly on top."
          fi
