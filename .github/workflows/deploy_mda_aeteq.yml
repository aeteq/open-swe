name: Deploy Managed Deep Agents (aeteq)

# Deploys mda/ to open-swe-mda, the deployment openswe-server's MDA_RUNTIME_URL
# points at, whenever main changes it. Upstream's deploy_mda.yml skips itself in
# this fork. The deploy is skipped when nothing it runs changed since its tag,
# which a successful deploy moves, so a failed one is retried next time.
# Only commits already on main are deployed: `mda deploy` can run project code
# while it holds the workspace deploy key.

on:
  push:
    branches: [main]
    paths:
      - "mda/**"
      - "packages/runtime-api/**"
      - "vendor/managed-deepagents-sdk/**"
      - "vendor/langchain-quickjs/**"
      - ".github/workflows/deploy_mda_aeteq.yml"
  workflow_dispatch:

permissions:
  # Moves the mda-deployed/aeteq tag to what the deployment runs.
  contents: write

jobs:
  deploy:
    name: Deploy open-swe-mda
    if: >-
      github.repository == 'aeteq/open-swe'
      && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: deploy-mda
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Refuse commits that are not on main
        run: |
          git merge-base --is-ancestor HEAD origin/main || {
            echo "::error::$(git rev-parse HEAD) is not on main; only main is deployed."
            exit 1
          }
      - name: Check whether the deployment is behind
        id: changed
        env:
          DEPLOYED_TAG: mda-deployed/aeteq
        run: |
          if [[ ! -f mda/agent.py ]]; then
            echo "mda/agent.py does not exist at this commit; nothing to deploy."
            echo "deploy=false" >>"$GITHUB_OUTPUT"
          elif git rev-parse -q --verify "refs/tags/${DEPLOYED_TAG}" >/dev/null \
            && git diff --quiet "refs/tags/${DEPLOYED_TAG}" HEAD -- mda packages/runtime-api vendor/managed-deepagents-sdk vendor/langchain-quickjs .github/workflows/deploy_mda_aeteq.yml; then
            echo "Nothing deployed changed since ${DEPLOYED_TAG}; nothing to deploy."
            echo "deploy=false" >>"$GITHUB_OUTPUT"
          else
            echo "deploy=true" >>"$GITHUB_OUTPUT"
          fi
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        if: steps.changed.outputs.deploy == 'true'
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        if: steps.changed.outputs.deploy == 'true'
      - name: Build the mda CLI
        if: steps.changed.outputs.deploy == 'true'
        # From the vendored SDK, into the runtime mda/ installs.
        run: make mda-cli
      - name: Deploy
        shell: bash
        if: steps.changed.outputs.deploy == 'true'
        env:
          # Reserved by `mda deploy`: it authenticates the deploy and is never forwarded as a deployment secret.
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          # The workspace is hosted on AWS; mda derives its control plane (aws.api.host.langchain.com) from this.
          LANGSMITH_ENDPOINT: https://aws.api.smith.langchain.com
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Shared with openswe-server: MDA signs each call its channels make to it.
          MDA_SERVICE_SECRET: ${{ secrets.MDA_SERVICE_SECRET }}
          # openswe-server's own Slack app, which deploy registers with Trigger Server for the
          # Slack channel; its URLs stay at the backend. Deploy never forwards these.
          MDA_SLACK_BOT_TOKEN: ${{ secrets.MDA_SLACK_BOT_TOKEN }}
          MDA_SLACK_SIGNING_SECRET: ${{ secrets.MDA_SLACK_SIGNING_SECRET }}
          # The jarvis-aeteq App, which deploy brings into Agent Auth when the deployment has
          # none yet; it cannot ask for it without a terminal. These never reach the deployment.
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.MDA_GITHUB_APP_PRIVATE_KEY }}
          GITHUB_APP_WEBHOOK_SECRET: ${{ secrets.MDA_GITHUB_WEBHOOK_SECRET }}
        run: |
          backend="https://openswe-server-2d069efe31505868bbd132b926048ef6.aws.us.langgraph.app"
          if [[ -z "$MDA_SERVICE_SECRET" ]]; then
            echo "::error::Set the MDA_SERVICE_SECRET secret to openswe-server's MDA_SERVICE_SECRET: without it the backend refuses every channel call."
            exit 1
          fi
          # The project .env is forwarded as the deployment's secrets: the backend it calls back,
          # the model key, the secret it signs its calls to the backend with (the backend acts on
          # the channels' threads with the same one, as MDA's ingress secret), and the commit its
          # traces name as their revision.
          printf 'OPEN_SWE_BACKEND_URL=%s\nANTHROPIC_API_KEY=%s\nMDA_SERVICE_SECRET=%s\nMDA_INGRESS_SECRET=%s\nLANGSMITH_REVISION_ID=%s\n' \
            "$backend" "$ANTHROPIC_API_KEY" "$MDA_SERVICE_SECRET" "$MDA_SERVICE_SECRET" "$(git rev-parse HEAD)" >mda/.env
          # Deploy reads the App's key from a file. Set all of the App's values or none: an App ID
          # without its key fails the deploy.
          if [[ -n "$GITHUB_APP_PRIVATE_KEY" ]]; then
            key_file="$(mktemp "$RUNNER_TEMP/github-app-key.XXXXXX")"
            trap 'rm -f "$key_file"' EXIT
            printf '%s\n' "$GITHUB_APP_PRIVATE_KEY" >"$key_file"
            export MDA_GITHUB_APP_ID=4181923
            export MDA_GITHUB_APP_INSTALLATION_ID=143504530
            export MDA_GITHUB_APP_PRIVATE_KEY_FILE="$key_file"
            export MDA_GITHUB_WEBHOOK_SECRET="$GITHUB_APP_WEBHOOK_SECRET"
          fi
          unset GITHUB_APP_PRIVATE_KEY GITHUB_APP_WEBHOOK_SECRET
          uv run --project mda --locked --python 3.14 mda deploy mda \
            --name "open-swe-mda" \
            --deployment-type prod \
            --workspace-id 7657d5d9-dea8-46fd-a8ab-d26db7f80e5f \
            --context-strategy overwrite \
            --yes
      - name: Record what the deployment runs
        if: steps.changed.outputs.deploy == 'true'
        env:
          DEPLOYED_TAG: mda-deployed/aeteq
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" \
            "HEAD:refs/tags/${DEPLOYED_TAG}"
